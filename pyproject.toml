[project]
name = "ai-shi"
version = "0.1.0"
description = "Agentic mutual fund overlap and concentration-risk analyzer"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.3",
    "prefect>=2.19",
    "google-genai>=1.0",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
